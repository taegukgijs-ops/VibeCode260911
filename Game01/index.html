<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON TETRIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">+</span><span>NEON TETRIS</span></div>
      <div class="status"><span class="status-dot"></span><span id="statusText">READY TO PLAY</span></div>
    </header>

    <section class="game-layout">
      <div class="board-frame">
        <div class="board-heading"><span>PLAYFIELD</span><span id="levelLabel">LV 01</span></div>
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
          <div id="overlay" class="overlay">
            <p class="overlay-kicker">SYSTEM READY</p>
            <h1>테트리스</h1>
            <p>블록을 쌓아 줄을 완성하세요.</p>
            <button id="startButton" class="primary-button">게임 시작</button>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <section class="panel score-panel">
          <div class="panel-label">SCORE</div>
          <div id="score" class="score-value">000000</div>
          <div class="stats-row"><span>LINES</span><strong id="lines">000</strong></div>
          <div class="stats-row"><span>LEVEL</span><strong id="level">01</strong></div>
        </section>

        <section class="panel next-panel">
          <div class="panel-label">NEXT BLOCK</div>
          <canvas id="nextCanvas" width="128" height="128" aria-label="다음 블록 미리보기"></canvas>
        </section>

        <section class="panel controls-panel">
          <div class="panel-label">CONTROLS</div>
          <div class="key-row"><span class="key">←</span><span class="key">↓</span><span class="key">→</span><span>이동</span></div>
          <div class="key-row"><span class="key wide">SPACE</span><span>하드 드롭</span></div>
          <div class="key-row"><span class="key">↑</span><span>회전</span></div>
          <div class="key-row"><span class="key">P</span><span>일시정지</span></div>
        </section>

        <div class="button-row">
          <button id="pauseButton" class="secondary-button" disabled>일시정지</button>
          <button id="restartButton" class="secondary-button">다시 시작</button>
        </div>
      </aside>
    </section>

    <footer>HTML5 / CSS3 / JAVASCRIPT <span>•</span> BUILD 01</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
